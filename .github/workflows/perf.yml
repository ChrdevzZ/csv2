name: Performance evidence

on:
  workflow_call:
    inputs:
      protocol_smoke:
        type: boolean
        default: true
      baseline_ref:
        type: string
        default: ""
      candidate_ref:
        type: string
        default: ""
      runs:
        type: string
        default: "20"
      files:
        type: string
        default: all
      operations:
        type: string
        default: rows_cells,legacy_writer_raw,writer_raw_direct,writer_raw_streamable,writer_escaped_direct,writer_escaped_streamable
      corpus_scale:
        type: string
        default: "100"
      evidence:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or ref
        required: true
        type: string
      candidate_ref:
        description: Candidate SHA (controlled requires 40 hex; exploratory may be empty)
        required: false
        default: ""
        type: string
      runs:
        description: Paired runs/repetitions
        required: true
        default: "20"
        type: string
      files:
        description: Corpus filenames or all; fixed metrics uses the first selection
        required: true
        default: all
        type: string
      operations:
        description: Common-driver operations; must include rows_cells
        required: true
        default: rows_cells,legacy_writer_raw,writer_raw_direct,writer_raw_streamable,writer_escaped_direct,writer_escaped_streamable
        type: string
      corpus_scale:
        description: Deterministic corpus row multiplier
        required: true
        default: "100"
        type: string
      evidence:
        description: Evidence class
        required: true
        default: exploratory
        type: choice
        options:
          - exploratory
          - controlled

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}-${{ inputs.evidence || 'protocol-smoke' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-smoke:
    if: github.event_name == 'pull_request' && inputs.protocol_smoke
    name: Perf / PR protocol smoke / GCC 14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact base and head revisions
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$CANDIDATE_SHA"
          test "$BASELINE_SHA" != "$CANDIDATE_SHA"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git cat-file -e '9504e0b^{commit}'
          printf 'BASELINE_SHA=%s\nCANDIDATE_SHA=%s\n' \
            "$BASELINE_SHA" "$CANDIDATE_SHA" >> "$GITHUB_ENV"
          mkdir -p build-perf-smoke/reports

      - name: Build current-tree metrics and deterministic corpus
        run: |
          python3 benchmark/collect_metrics.py \
            --repository . --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf-smoke/current-owned \
            --corpus-scale 1 \
            --compiler-executable "$(command -v g++-14)" \
            --compiler-flags="-O3 -DNDEBUG" \
            --operation traversal/rows-cells \
            --input short_unquoted.csv --source buffer --runs 1 \
            --minimum-time 0.001s --warmup-seconds 0 \
            --evidence-level exploratory --skip-pmu \
            --output build-perf-smoke/reports/current-metrics.json
          cmake --build build-perf-smoke/current-owned/build --parallel
          ctest --test-dir build-perf-smoke/current-owned/build \
            -L benchmark-checksum --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build-perf-smoke/reports/benchmark-checksum.xml"

      - name: Run owned candidate A/A and base-to-head A/B
        run: |
          datasets=build-perf-smoke/current-owned/build/benchmark-corpus/fixtures
          compiler=$(command -v g++-14)
          operations=rows_cells,legacy_writer_raw,writer_raw_direct,writer_raw_streamable,writer_escaped_direct,writer_escaped_streamable
          python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref "$CANDIDATE_SHA" --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf-smoke/common-aa \
            --compiler-executable "$compiler" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets "$datasets" --runs 3 --warmups 1 --iterations 1 \
            --operations "$operations" --sources buffer \
            --files short_unquoted.csv --mode aa \
            --evidence-level exploratory \
            --output build-perf-smoke/reports/aa.json
          python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref "$BASELINE_SHA" --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf-smoke/common-ab \
            --compiler-executable "$compiler" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets "$datasets" --runs 3 --warmups 1 --iterations 1 \
            --operations "$operations" --sources buffer \
            --files short_unquoted.csv --mode compare \
            --calibration build-perf-smoke/reports/aa.json \
            --evidence-level exploratory \
            --output build-perf-smoke/reports/ab.json

      - name: Verify legacy-only owned build against the original baseline
        run: |
          python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref 9504e0b --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf-smoke/common-legacy \
            --compiler-executable "$(command -v g++-14)" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets build-perf-smoke/current-owned/build/benchmark-corpus/fixtures \
            --runs 1 --warmups 0 --iterations 1 \
            --operations rows_cells,legacy_writer_raw --sources buffer \
            --files short_unquoted.csv --mode compare --allow-uncalibrated \
            --evidence-level exploratory \
            --output build-perf-smoke/reports/legacy-ab.json

      - name: Finalize and validate exploratory evidence
        run: |
          python3 benchmark/finalize_evidence.py \
            --calibration build-perf-smoke/reports/aa.json \
            --calibration-manifest build-perf-smoke/reports/aa.json.sha256.json \
            --comparison build-perf-smoke/reports/ab.json \
            --comparison-manifest build-perf-smoke/reports/ab.json.sha256.json \
            --fixed-metrics build-perf-smoke/reports/current-metrics.json \
            --fixed-metrics-manifest build-perf-smoke/reports/current-metrics.json.sha256.json \
            --corpus-manifest build-perf-smoke/current-owned/build/benchmark-corpus/manifest.json \
            --output build-perf-smoke/reports/evidence.json
          python3 -B -c 'import json,sys; sys.path.insert(0,"benchmark/tools"); from csv2bench import protocol; root="build-perf-smoke/reports/"; [protocol.validate_comparison_report(json.load(open(root+n,encoding="utf-8"))) for n in ("aa.json","ab.json","legacy-ab.json")]; protocol.validate_fixed_metrics_report(json.load(open(root+"current-metrics.json",encoding="utf-8"))); protocol.validate_evidence_bundle(json.load(open(root+"evidence.json",encoding="utf-8")))'

      - name: Upload protocol-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csv2-perf-protocol-smoke-${{ github.run_id }}
          path: |
            build-perf-smoke/reports
            build-perf-smoke/current-owned/build/benchmark-corpus/manifest.json
          if-no-files-found: error

  exploratory:
    if: inputs.evidence == 'exploratory'
    name: Perf / exploratory / hosted Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable revisions
        env:
          BASELINE_INPUT: ${{ inputs.baseline_ref }}
          CANDIDATE_INPUT: ${{ inputs.candidate_ref }}
          OPERATIONS: ${{ inputs.operations }}
        run: |
          set -euo pipefail
          baseline=$(git rev-parse "${BASELINE_INPUT}^{commit}")
          candidate_input=${CANDIDATE_INPUT:-$GITHUB_SHA}
          requested_candidate=$(git rev-parse "${candidate_input}^{commit}")
          candidate=$(git rev-parse 'HEAD^{commit}')
          test "$candidate" = "$requested_candidate"
          test "$baseline" != "$candidate"
          python3 -c 'import sys; values=[v.strip() for v in sys.argv[1].split(",")]; assert "rows_cells" in values and all(values) and len(values)==len(set(values)), "operations must be unique and include rows_cells"' "$OPERATIONS"
          git cat-file -e "${baseline}^{commit}"
          printf 'BASELINE_SHA=%s\nCANDIDATE_SHA=%s\n' \
            "$baseline" "$candidate" >> "$GITHUB_ENV"
          mkdir -p build-perf/reports

      - name: Collect exploratory current-tree metrics from owned build
        env:
          RUNS: ${{ inputs.runs }}
          CORPUS_SCALE: ${{ inputs.corpus_scale }}
          FILES: ${{ inputs.files }}
        run: |
          metrics_file=$(python3 -c \
            'import sys; v=sys.argv[1]; print("short_unquoted.csv" if v=="all" else v.split(",",1)[0].strip())' \
            "$FILES")
          test -n "$metrics_file"
          python3 benchmark/collect_metrics.py \
            --repository . --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf/current-owned \
            --corpus-scale "$CORPUS_SCALE" \
            --compiler-executable "$(command -v g++-14)" \
            --compiler-flags="-O3 -DNDEBUG" \
            --operation traversal/rows-cells \
            --input "$metrics_file" --source buffer --runs "$RUNS" \
            --minimum-time 0.1s --warmup-seconds 0.1 \
            --evidence-level exploratory --skip-pmu \
            --output build-perf/reports/current-metrics.json

      - name: Verify owned current-tree checksums and corpus
        run: |
          cmake --build build-perf/current-owned/build --parallel
          ctest --test-dir build-perf/current-owned/build \
            -L benchmark-checksum --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build-perf/reports/benchmark-checksum.xml"

      - name: Collect exploratory owned A/A and A/B reports
        env:
          RUNS: ${{ inputs.runs }}
          FILES: ${{ inputs.files }}
          OPERATIONS: ${{ inputs.operations }}
        run: |
          datasets=build-perf/current-owned/build/benchmark-corpus/fixtures
          compiler=$(command -v g++-14)
          python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref "$CANDIDATE_SHA" \
            --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf/common-aa \
            --compiler-executable "$compiler" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets "$datasets" --runs "$RUNS" --warmups 3 --iterations 10 \
            --operations "$OPERATIONS" \
            --sources buffer,mmap --files "$FILES" --mode aa \
            --evidence-level exploratory \
            --output build-perf/reports/aa.json
          python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref "$BASELINE_SHA" \
            --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf/common-ab \
            --compiler-executable "$compiler" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets "$datasets" --runs "$RUNS" --warmups 3 --iterations 10 \
            --operations "$OPERATIONS" \
            --sources buffer,mmap --files "$FILES" --mode compare \
            --calibration build-perf/reports/aa.json \
            --evidence-level exploratory \
            --output build-perf/reports/ab.json

      - name: Finalize exploratory evidence bundle
        run: |
          python3 benchmark/finalize_evidence.py \
            --calibration build-perf/reports/aa.json \
            --calibration-manifest build-perf/reports/aa.json.sha256.json \
            --comparison build-perf/reports/ab.json \
            --comparison-manifest build-perf/reports/ab.json.sha256.json \
            --fixed-metrics build-perf/reports/current-metrics.json \
            --fixed-metrics-manifest build-perf/reports/current-metrics.json.sha256.json \
            --corpus-manifest build-perf/current-owned/build/benchmark-corpus/manifest.json \
            --output build-perf/reports/evidence.json

      - name: Upload exploratory failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csv2-perf-exploratory-diagnostics-${{ github.run_id }}
          path: |
            build-perf/reports
            build-perf/current-owned/build/benchmark-corpus/manifest.json
          if-no-files-found: warn

      - name: Upload exploratory evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csv2-perf-exploratory-${{ github.run_id }}
          path: |
            build-perf/reports
            build-perf/current-owned/build/benchmark-corpus/manifest.json
          if-no-files-found: error

  authorize-controlled:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence == 'controlled'
    name: Perf / authorize controlled dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline_sha: ${{ steps.authorize.outputs.baseline_sha }}
      candidate_sha: ${{ steps.authorize.outputs.candidate_sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize owner, branch, and immutable revisions
        id: authorize
        env:
          ACTOR: ${{ github.actor }}
          BASELINE_INPUT: ${{ inputs.baseline_ref }}
          CANDIDATE_INPUT: ${{ inputs.candidate_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          OPERATIONS: ${{ inputs.operations }}
          OWNER: ${{ github.repository_owner }}
          RUNS: ${{ inputs.runs }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER"
          test "$TRIGGERING_ACTOR" = "$OWNER"
          test "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$BASELINE_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_INPUT" =~ ^[0-9a-f]{40}$ ]]
          test "$BASELINE_INPUT" != "$CANDIDATE_INPUT"
          test "$RUNS" -ge 20
          git cat-file -e "${BASELINE_INPUT}^{commit}"
          git cat-file -e "${CANDIDATE_INPUT}^{commit}"
          python3 -c 'import sys; values=[v.strip() for v in sys.argv[1].split(",")]; assert "rows_cells" in values and all(values) and len(values)==len(set(values)), "operations must be unique and include rows_cells"' "$OPERATIONS"
          printf 'baseline_sha=%s\ncandidate_sha=%s\n' \
            "$BASELINE_INPUT" "$CANDIDATE_INPUT" >> "$GITHUB_OUTPUT"

  controlled:
    needs: authorize-controlled
    if: needs.authorize-controlled.result == 'success'
    name: Perf / controlled / csv2-perf runner
    runs-on: [self-hosted, linux, x64, csv2-perf]
    environment: csv2-perf
    timeout-minutes: 180
    steps:
      - name: Check out exact candidate repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize-controlled.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate runner and resolve immutable revisions
        env:
          BASELINE_SHA: ${{ needs.authorize-controlled.outputs.baseline_sha }}
          CANDIDATE_SHA: ${{ needs.authorize-controlled.outputs.candidate_sha }}
          RUNS: ${{ inputs.runs }}
          OPERATIONS: ${{ inputs.operations }}
        run: |
          set -euo pipefail
          test "$RUNS" -ge 20
          : "${CSV2_PERF_MACHINE_PROFILE:?CSV2_PERF_MACHINE_PROFILE is required}"
          command -v taskset
          candidate=$(git rev-parse 'HEAD^{commit}')
          test "$candidate" = "$CANDIDATE_SHA"
          test "$BASELINE_SHA" != "$CANDIDATE_SHA"
          python3 -c 'import sys; values=[v.strip() for v in sys.argv[1].split(",")]; assert "rows_cells" in values and all(values) and len(values)==len(set(values)), "operations must be unique and include rows_cells"' "$OPERATIONS"
          printf 'BASELINE_SHA=%s\nCANDIDATE_SHA=%s\n' \
            "$BASELINE_SHA" "$CANDIDATE_SHA" >> "$GITHUB_ENV"
          mkdir -p build-perf/reports
          cp --no-clobber "$CSV2_PERF_MACHINE_PROFILE" \
            build-perf/reports/machine-profile.json
          chmod 0444 build-perf/reports/machine-profile.json
          printf 'PROFILE_PATH=%s\n' \
            "$GITHUB_WORKSPACE/build-perf/reports/machine-profile.json" >> "$GITHUB_ENV"

      - name: Collect controlled current-tree metrics from owned build
        env:
          RUNS: ${{ inputs.runs }}
          CORPUS_SCALE: ${{ inputs.corpus_scale }}
          FILES: ${{ inputs.files }}
        run: |
          metrics_file=$(python3 -c \
            'import sys; v=sys.argv[1]; print("short_unquoted.csv" if v=="all" else v.split(",",1)[0].strip())' \
            "$FILES")
          test -n "$metrics_file"
          taskset -c 0 python3 benchmark/collect_metrics.py \
            --repository . --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf/current-owned \
            --corpus-scale "$CORPUS_SCALE" \
            --compiler-executable "$(command -v g++)" \
            --compiler-flags="-O3 -DNDEBUG" \
            --operation traversal/rows-cells \
            --input "$metrics_file" --source buffer --runs "$RUNS" \
            --minimum-time 0.5s --warmup-seconds 0.5 \
            --evidence-level controlled --cpu-affinity 0 \
            --machine-profile "$PROFILE_PATH" \
            --output build-perf/reports/current-metrics.json

      - name: Verify owned current-tree checksums and corpus
        run: |
          cmake --build build-perf/current-owned/build --parallel
          ctest --test-dir build-perf/current-owned/build \
            -L benchmark-checksum --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build-perf/reports/benchmark-checksum.xml"

      - name: Collect controlled owned A/A and A/B reports
        env:
          RUNS: ${{ inputs.runs }}
          FILES: ${{ inputs.files }}
          OPERATIONS: ${{ inputs.operations }}
        run: |
          datasets=build-perf/current-owned/build/benchmark-corpus/fixtures
          compiler=$(command -v g++)
          taskset -c 0 python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref "$CANDIDATE_SHA" \
            --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf/common-aa \
            --compiler-executable "$compiler" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets "$datasets" --runs "$RUNS" --warmups 3 --iterations 10 \
            --operations "$OPERATIONS" \
            --sources buffer,mmap --files "$FILES" --mode aa \
            --evidence-level controlled --cpu-affinity 0 \
            --machine-profile "$PROFILE_PATH" \
            --output build-perf/reports/aa.json
          taskset -c 0 python3 benchmark/run_suite.py \
            --repository . \
            --baseline-ref "$BASELINE_SHA" \
            --candidate-ref "$CANDIDATE_SHA" \
            --build-root build-perf/common-ab \
            --compiler-executable "$compiler" \
            --compiler-flags="-std=c++11 -O3 -DNDEBUG" \
            --datasets "$datasets" --runs "$RUNS" --warmups 3 --iterations 10 \
            --operations "$OPERATIONS" \
            --sources buffer,mmap --files "$FILES" --mode compare \
            --calibration build-perf/reports/aa.json \
            --evidence-level controlled --cpu-affinity 0 \
            --machine-profile "$PROFILE_PATH" \
            --output build-perf/reports/ab.json

      - name: Finalize controlled evidence bundle
        run: |
          python3 benchmark/finalize_evidence.py \
            --calibration build-perf/reports/aa.json \
            --calibration-manifest build-perf/reports/aa.json.sha256.json \
            --comparison build-perf/reports/ab.json \
            --comparison-manifest build-perf/reports/ab.json.sha256.json \
            --fixed-metrics build-perf/reports/current-metrics.json \
            --fixed-metrics-manifest build-perf/reports/current-metrics.json.sha256.json \
            --corpus-manifest build-perf/current-owned/build/benchmark-corpus/manifest.json \
            --output build-perf/reports/evidence.json

      - name: Upload controlled failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csv2-perf-controlled-diagnostics-${{ github.run_id }}
          path: |
            build-perf/reports
            build-perf/current-owned/build/benchmark-corpus/manifest.json
          if-no-files-found: warn

      - name: Upload controlled evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csv2-perf-controlled-${{ github.run_id }}
          path: |
            build-perf/reports
            build-perf/current-owned/build/benchmark-corpus/manifest.json
          if-no-files-found: error
