name: macOS

on:
  workflow_call:
    inputs:
      quick:
        type: boolean
        default: true
      benchmark:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      quick:
        description: Run core and package contracts
        type: boolean
        default: true
      benchmark:
        description: Run AppleClang benchmark portability contracts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: inputs.quick || inputs.benchmark
    name: macOS / AppleClang 21
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=${{ inputs.quick && 'ON' || 'OFF' }}
          -DCSV2_BUILD_BENCHMARKS=${{ inputs.benchmark && 'ON' || 'OFF' }}
          -DCSV2_BUILD_BENCHMARK_CHECKS=${{ inputs.benchmark && 'ON' || 'OFF' }}
          -DCSV2_BENCHMARKS_EXCLUDE_FROM_ALL=ON
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=AppleClang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=21

      - name: Build
        if: inputs.quick
        run: cmake --build build --parallel

      - name: Build benchmark portability owners
        if: inputs.benchmark
        run: >-
          cmake --build build --parallel --target
          csv2_benchmark csv2_benchmark_allocations csv2_common_benchmark

      - name: Test
        if: inputs.quick
        run: >-
          ctest --test-dir build -LE benchmark-checksum
          --parallel 2 --no-tests=error
          --output-on-failure --output-junit ctest.xml

      - name: Test benchmark portability owners
        if: inputs.benchmark
        run: >-
          ctest --test-dir build -L benchmark-portability
          --parallel 2 --no-tests=error
          --output-on-failure --output-junit benchmark-portability.xml

      - name: Install package
        if: inputs.quick
        run: cmake --install build --prefix build/install

      - name: Verify installed package consumer
        if: inputs.quick
        run: |
          cmake -S test/contracts/consumer -B build/consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build --parallel
          ./build/consumer-build/csv2_consumer
          ./build/consumer-build/csv2_no_mmap_consumer

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-appleclang21-ctest
          path: |
            build/ctest.xml
            build/benchmark-portability.xml
          if-no-files-found: error
