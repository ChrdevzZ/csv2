name: Fuzz and benchmark smoke

on:
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Clang 18 / libFuzzer + benchmark checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=ON
          -DCSV2_BUILD_FUZZERS=ON
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build smoke targets
        run: >-
          cmake --build build --parallel
          --target csv2_fuzz csv2_fuzz_smoke csv2_benchmark

      - name: Run deterministic fuzz smoke
        run: ctest --test-dir build -L fuzz-smoke --no-tests=error --output-on-failure

      - name: Run libFuzzer corpus smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/test/csv2_fuzz -runs=5000 test/fuzz/corpus

      - name: Verify benchmark checksums
        run: >-
          ctest --test-dir build
          -L benchmark-checksum
          --no-tests=error
          --output-on-failure
