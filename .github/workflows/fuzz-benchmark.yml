name: Fuzz and benchmark smoke

on:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-benchmark-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name != 'schedule'
    name: Clang 18 / libFuzzer + benchmark checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_TEST_ASSERTION_BACKEND=minitest
          -DCSV2_BUILD_BENCHMARKS=ON
          -DCSV2_BUILD_BENCHMARK_CHECKS=ON
          -DCSV2_BUILD_FUZZERS=ON
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build smoke targets
        run: >-
          cmake --build build --parallel
          --target csv2_fuzz csv2_fuzz_writer csv2_fuzz_smoke csv2_fuzz_writer_smoke
          csv2_benchmark csv2_benchmark_allocations csv2_common_benchmark

      - name: Run deterministic fuzz smoke
        run: >-
          ctest --test-dir build -L fuzz-smoke --no-tests=error
          --output-on-failure --output-junit fuzz-smoke.xml

      - name: Run libFuzzer corpus smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python3 tools/ci/run_fuzz_targets.py
          --reader build/test/fuzz/csv2_fuzz
          --writer build/test/fuzz/csv2_fuzz_writer
          --reader-corpus test/fuzz/corpus/reader
          --writer-corpus test/fuzz/corpus/writer
          --runs 5000
          --artifact-root fuzz-artifacts

      - name: Verify benchmark checksums
        run: >-
          ctest --test-dir build
          -L benchmark-portability
          --no-tests=error
          --output-junit benchmark-checksum.xml
          --output-on-failure

      - name: Verify no-mmap benchmark configuration
        run: |
          cmake -S . -B build-no-mmap -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCSV2_BUILD_TESTS=OFF \
            -DCSV2_BUILD_BENCHMARKS=ON \
            -DCSV2_BUILD_BENCHMARK_CHECKS=ON \
            -DCSV2_BUILD_FUZZERS=OFF \
            -DCSV2_VERIFICATION_PROFILE=quick \
            -DCSV2_REQUIRE_PYTHON_AUDITS=ON \
            -DCSV2_HAS_MMAP=0 \
            -DCSV2_CI_EXPECTED_COMPILER_ID=Clang \
            -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18
          cmake --build build-no-mmap --parallel \
            --target csv2_benchmark csv2_benchmark_allocations \
            csv2_benchmark_observer_audit \
            csv2_common_benchmark csv2_common_benchmark_timer_audit
          ctest --test-dir build-no-mmap -L benchmark-checksum \
            --no-tests=error --output-on-failure \
            --output-junit benchmark-checksum.xml

      - name: Upload smoke reports and corpus manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-benchmark-smoke
          path: |
            build/fuzz-smoke.xml
            build/benchmark-checksum.xml
            build-no-mmap/benchmark-checksum.xml
            benchmark/datasets/manifest.json
            fuzz-artifacts
          if-no-files-found: error

  scheduled-fuzz:
    if: github.event_name == 'schedule'
    name: Clang 18 / weekly libFuzzer corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure fuzz-only build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=OFF
          -DCSV2_BUILD_BENCHMARKS=OFF
          -DCSV2_BUILD_BENCHMARK_CHECKS=OFF
          -DCSV2_BUILD_FUZZERS=ON
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build Reader and Writer libFuzzer targets
        run: >-
          cmake --build build --parallel
          --target csv2_fuzz csv2_fuzz_writer

      - name: Run weekly libFuzzer corpus
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python3 tools/ci/run_fuzz_targets.py
          --reader build/test/fuzz/csv2_fuzz
          --writer build/test/fuzz/csv2_fuzz_writer
          --reader-corpus test/fuzz/corpus/reader
          --writer-corpus test/fuzz/corpus/writer
          --runs 50000
          --artifact-root fuzz-artifacts

      - name: Upload weekly fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-fuzz-reproducers-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14
