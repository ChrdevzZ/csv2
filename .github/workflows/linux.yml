name: Linux

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: Linux / GCC 14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=ON
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Verify reduced compiler feature matrix
        run: |
          cmake -S . -B build-reduced -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_COMPILE_FEATURES=cxx_std_11 \
            -DCSV2_BUILD_TESTS=ON \
            -DCSV2_BUILD_BENCHMARKS=OFF
          cmake --build build-reduced --target \
            csv2_test csv2_single_header_test \
            csv2_standard_contract_module_cxx11 \
            csv2_standard_contract_single_cxx11 --parallel
          cmake --build build-reduced --target help > build-reduced/targets.txt
          if grep -Eq 'cxx(14|17|20|23|26)' build-reduced/targets.txt; then
            grep -E 'cxx(14|17|20|23|26)' build-reduced/targets.txt
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install package
        run: cmake --install build --prefix build/install

      - name: Verify installed package consumer
        run: |
          mkdir -p build/consumer
          cat > build/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(csv2_consumer LANGUAGES CXX)
          find_package(csv2 CONFIG REQUIRED)
          add_executable(csv2_consumer main.cpp)
          target_link_libraries(csv2_consumer PRIVATE csv2::csv2)
          target_compile_features(csv2_consumer PRIVATE cxx_std_20)
          set_target_properties(csv2_consumer PROPERTIES CXX_EXTENSIONS OFF)
          add_executable(csv2_no_mmap_consumer no_mmap.cpp)
          target_link_libraries(csv2_no_mmap_consumer PRIVATE csv2::csv2)
          target_compile_features(csv2_no_mmap_consumer PRIVATE cxx_std_11)
          target_compile_definitions(csv2_no_mmap_consumer PRIVATE CSV2_HAS_MMAP=0)
          set_target_properties(csv2_no_mmap_consumer PROPERTIES CXX_EXTENSIONS OFF)
          EOF
          cat > build/consumer/main.cpp <<'EOF'
          #include <csv2/reader.hpp>
          #include <string>

          int main() {
            csv2::Reader<> reader;
            return reader.parse(std::string("a,b")) ? 0 : 1;
          }
          EOF
          cat > build/consumer/no_mmap.cpp <<'EOF'
          #include <csv2/mio.hpp>
          #ifdef MIO_MMAP_HEADER
          #error "mio must be absent when CSV2_HAS_MMAP=0"
          #endif
          #include <csv2/errors.hpp>
          #include <csv2/parameters.hpp>
          #include <csv2/reader.hpp>
          #include <csv2/writer.hpp>
          int main() { return CSV2_HAS_MMAP; }
          EOF
          cmake -S build/consumer -B build/consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build --parallel
          ./build/consumer-build/csv2_consumer
          ./build/consumer-build/csv2_no_mmap_consumer

      - name: Verify relocatable pkg-config consumer
        run: |
          csv2_pc_dir="$(dirname "$(find build/install -name csv2.pc -print -quit)")"
          csv2_includedir="$(PKG_CONFIG_PATH="$csv2_pc_dir" pkg-config \
            --variable=includedir csv2)"
          test -f "$csv2_includedir/csv2/reader.hpp"
          cat > build/pkg-config-consumer.cpp <<'EOF'
          #define CSV2_HAS_MMAP 0
          #include <csv2/mio.hpp>
          #ifdef MIO_MMAP_HEADER
          #error "mio must be absent when CSV2_HAS_MMAP=0"
          #endif
          #include <csv2/errors.hpp>
          #include <csv2/parameters.hpp>
          #include <csv2/reader.hpp>
          #include <csv2/writer.hpp>
          int main() { return CSV2_HAS_MMAP; }
          EOF
          g++-14 -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            $(PKG_CONFIG_PATH="$csv2_pc_dir" pkg-config --cflags csv2) \
            build/pkg-config-consumer.cpp -o build/pkg-config-consumer
          ./build/pkg-config-consumer

      - name: Verify single-header regeneration
        run: |
          python3 utils/amalgamate/amalgamate.py -c single_include.json -s .
          git diff --exit-code -- single_include/csv2/csv2.hpp

  gcc-sanitizers:
    name: Linux / GCC 14 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=OFF
          -DCSV2_ENABLE_SANITIZERS=ON
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Build
        run: cmake --build build --parallel

      - name: Test with ASan, UBSan, and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-runtime
          --no-tests=error
          --output-on-failure

  clang:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: Clang 18 + libc++
            build_type: Release
            benchmarks: "ON"
            sanitizers: "OFF"
          - compiler: Clang 18 + libc++ / ASan + UBSan
            build_type: Debug
            benchmarks: "OFF"
            sanitizers: "ON"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Clang 18 libc++ and clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libc++-18-dev libc++abi-18-dev clang-format-18

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=${{ matrix.benchmarks }}
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        if: matrix.sanitizers == 'OFF'
        run: ctest --test-dir build --output-on-failure

      - name: Test with ASan and UBSan
        if: matrix.sanitizers == 'ON'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-runtime
          --no-tests=error
          --output-on-failure

      - name: Check first-party C++ formatting
        if: matrix.sanitizers == 'OFF'
        run: |
          git ls-files -z -- \
            'include/csv2/detail/*.hpp' \
            'include/csv2/errors.hpp' \
            'include/csv2/parameters.hpp' \
            'include/csv2/reader.hpp' \
            'include/csv2/writer.hpp' \
            'benchmark/common_driver.cpp' \
            'benchmark/main.cpp' \
            'test/config.cpp' \
            'test/config_fallback.cpp' \
            'test/fuzz_reader.cpp' \
            'test/main.cpp' \
            'test/mmap_path.cpp' \
            'test/standard_cxx*.cpp' | \
            xargs -0 clang-format-18 --dry-run --Werror
