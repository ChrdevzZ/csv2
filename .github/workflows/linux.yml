name: Linux

on:
  workflow_call:
    inputs:
      quick:
        type: boolean
        default: true
      benchmark:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      quick:
        description: Run core, package, and sanitizer contracts
        type: boolean
        default: true
      benchmark:
        description: Run Clang benchmark portability contracts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gcc:
    if: inputs.quick
    name: Linux / GCC 14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ccache

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: csv2-ccache-v2-linux-gcc14-quick-${{ github.sha }}
          restore-keys: |
            csv2-ccache-v2-linux-gcc14-quick-
            csv2-ccache-v2-linux-gcc14-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_TEST_ASSERTION_BACKEND=minitest
          -DCSV2_BUILD_BENCHMARKS=OFF
          -DCSV2_BUILD_BENCHMARK_CHECKS=OFF
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Verify reduced compiler feature matrix
        run: |
          cmake -S . -B build-reduced -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILE_FEATURES=cxx_std_11 \
            -DCSV2_BUILD_TESTS=ON \
            -DCSV2_BUILD_BENCHMARKS=OFF \
            -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          cmake --build build-reduced --target \
            csv2_test csv2_single_header_test \
            csv2_standard_contract_module_cxx11 \
            csv2_standard_contract_single_cxx11 --parallel

      - name: Build
        run: cmake --build build --parallel

      - name: Build source packages
        run: cmake --build build --target package_source

      - name: Verify source package archives
        run: |
          set -euo pipefail
          python3 tools/ci/verify_source_archives.py \
            --source-root . \
            --extract-root build/source-archives \
            build/csv2-*.tar.gz build/csv2-*.tar.xz
          source_tree_count=0
          for source_tree in build/source-archives/{tgz,txz}/csv2-*; do
            [[ -d "$source_tree" ]]
            source_kind="$(basename "$(dirname "$source_tree")")"
            source_build="build/source-${source_kind}-build"
            source_install="build/source-${source_kind}-install"
            source_consumer="build/source-${source_kind}-consumer"
            cmake -S "$source_tree" -B "$source_build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-14
            cmake --build "$source_build" --parallel
            cmake --install "$source_build" --prefix "$source_install"
            cmake -S "$source_tree/test/contracts/consumer" \
              -B "$source_consumer" -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_PREFIX_PATH="$PWD/$source_install"
            cmake --build "$source_consumer" --parallel
            "$source_consumer/csv2_consumer"
            "$source_consumer/csv2_no_mmap_consumer"
            g++-14 -std=c++11 -Wall -Wextra -Wpedantic -Werror \
              -DCSV2_TEST_SINGLE_HEADER=1 \
              -I "$source_tree/single_include" \
              -c "$source_tree/test/contracts/headers/self_containment.cpp" \
              -o "$source_consumer/single-header.o"
            source_tree_count=$((source_tree_count + 1))
          done
          [[ "$source_tree_count" -eq 2 ]]

      - name: Test
        run: >-
          ctest --test-dir build --parallel 2
          --output-on-failure --output-junit ctest.xml

      - name: Install package
        run: cmake --install build --prefix build/install

      - name: Verify installed package consumer
        run: |
          cmake -S test/contracts/consumer -B build/consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build --parallel
          ./build/consumer-build/csv2_consumer
          ./build/consumer-build/csv2_no_mmap_consumer

      - name: Verify relocatable pkg-config consumer
        run: |
          csv2_pc_dir="$PWD/build/install/lib/pkgconfig"
          read -r -a csv2_cflags <<< \
            "$(PKG_CONFIG_LIBDIR="$csv2_pc_dir" pkg-config --cflags csv2)"
          g++-14 -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            "${csv2_cflags[@]}" \
            test/contracts/consumer/pkg_config.cpp -o build/pkg-config-consumer
          ./build/pkg-config-consumer

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-gcc14-ctest
          path: build/ctest.xml
          if-no-files-found: error

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: >-
          success() &&
          steps.ccache-restore.outputs.cache-hit != 'true' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: csv2-ccache-v2-linux-gcc14-quick-${{ github.sha }}

  gcc-sanitizers:
    if: inputs.quick
    name: Linux / GCC 14 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ccache

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: csv2-ccache-v2-linux-gcc14-sanitizer-${{ github.sha }}
          restore-keys: csv2-ccache-v2-linux-gcc14-sanitizer-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_TEST_ASSERTION_BACKEND=minitest
          -DCSV2_BUILD_BENCHMARKS=OFF
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_ENABLE_SANITIZERS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Build sanitizer smoke
        run: cmake --build build --parallel --target csv2_sanitizer_smoke

      - name: Verify sanitizer smoke inventory
        run: >-
          python3 tools/ci/verify_ctest_inventory.py
          --build-dir build
          --label sanitizer-smoke
          --expected-targets build/test/sanitizer-smoke-targets.txt
          --expected-tests test/cmake/sanitizer-smoke-linux.tsv

      - name: Test with ASan, UBSan, and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-smoke
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: >-
          success() &&
          steps.ccache-restore.outputs.cache-hit != 'true' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: csv2-ccache-v2-linux-gcc14-sanitizer-${{ github.sha }}

  clang:
    if: inputs.quick || inputs.benchmark
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.quick && '[{"compiler":"Clang 18 + libc++","artifact":"clang18-libcxx","build_type":"Release","benchmarks":"ON","sanitizers":"OFF","assertion_backend":"auto"},{"compiler":"Clang 18 + libc++ / ASan + UBSan","artifact":"clang18-libcxx-sanitizers","build_type":"Debug","benchmarks":"OFF","sanitizers":"ON","assertion_backend":"minitest"}]' || '[{"compiler":"Clang 18 + libc++","artifact":"clang18-libcxx","build_type":"Release","benchmarks":"ON","sanitizers":"OFF","assertion_backend":"auto"}]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Clang 18 dependencies
        run: |
          set -euo pipefail
          packages=(ccache libc++-18-dev libc++abi-18-dev)
          if [[ '${{ matrix.sanitizers }}' == 'OFF' ]]; then
            packages+=(clang-format-18)
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends "${packages[@]}"

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: csv2-ccache-v2-linux-${{ matrix.artifact }}-${{ github.sha }}
          restore-keys: csv2-ccache-v2-linux-${{ matrix.artifact }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=${{ inputs.quick && 'ON' || 'OFF' }}
          -DCSV2_TEST_ASSERTION_BACKEND=${{ matrix.assertion_backend }}
          -DCSV2_BUILD_BENCHMARKS=${{ inputs.benchmark && matrix.benchmarks == 'ON' && 'ON' || 'OFF' }}
          -DCSV2_BUILD_BENCHMARK_CHECKS=${{ inputs.benchmark && matrix.benchmarks == 'ON' && 'ON' || 'OFF' }}
          -DCSV2_BENCHMARKS_EXCLUDE_FROM_ALL=ON
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build
        if: matrix.sanitizers == 'OFF' && inputs.quick
        run: cmake --build build --parallel

      - name: Build benchmark portability owners
        if: matrix.sanitizers == 'OFF' && inputs.benchmark
        run: >-
          cmake --build build --parallel
          --target csv2_benchmark_portability

      - name: Build sanitizer smoke
        if: matrix.sanitizers == 'ON'
        run: cmake --build build --parallel --target csv2_sanitizer_smoke

      - name: Verify sanitizer smoke inventory
        if: matrix.sanitizers == 'ON'
        run: >-
          python3 tools/ci/verify_ctest_inventory.py
          --build-dir build
          --label sanitizer-smoke
          --expected-targets build/test/sanitizer-smoke-targets.txt
          --expected-tests test/cmake/sanitizer-smoke-linux.tsv

      - name: Test
        if: matrix.sanitizers == 'OFF' && inputs.quick
        run: >-
          ctest --test-dir build -LE benchmark-checksum
          --parallel 2 --no-tests=error --output-on-failure
          --output-junit ctest.xml

      - name: Test benchmark portability owners
        if: matrix.sanitizers == 'OFF' && inputs.benchmark
        run: >-
          ctest --test-dir build -L benchmark-portability
          --parallel 2 --no-tests=error --output-on-failure
          --output-junit benchmark-portability.xml

      - name: Test with ASan and UBSan
        if: matrix.sanitizers == 'ON'
        env:
          # Ubuntu's prebuilt libc++/libc++abi hits LLVM #59432: its packaging
          # prevents ASan from interposing exception deallocation. The GCC
          # sanitizer job above retains alloc/dealloc mismatch coverage.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:alloc_dealloc_mismatch=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-smoke
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

      - name: Check first-party C++ formatting
        if: matrix.sanitizers == 'OFF'
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' \
            ':!third_party/**' ':!single_include/**' ':!include/csv2/mio.hpp' | \
            xargs -0 clang-format-18 --dry-run --Werror

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.artifact }}-ctest
          path: |
            build/ctest.xml
            build/benchmark-portability.xml
          if-no-files-found: error

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: >-
          success() &&
          steps.ccache-restore.outputs.cache-hit != 'true' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: csv2-ccache-v2-linux-${{ matrix.artifact }}-${{ github.sha }}
