name: Linux

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: Linux / GCC 14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=ON
          -DCSV2_BUILD_BENCHMARK_CHECKS=ON
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Verify reduced compiler feature matrix
        run: |
          cmake -S . -B build-reduced -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_COMPILE_FEATURES=cxx_std_11 \
            -DCSV2_BUILD_TESTS=ON \
            -DCSV2_BUILD_BENCHMARKS=OFF
          cmake --build build-reduced --target \
            csv2_test csv2_single_header_test \
            csv2_standard_contract_module_cxx11 \
            csv2_standard_contract_single_cxx11 --parallel
          cmake --build build-reduced --target help > build-reduced/targets.txt
          if grep -Eq 'cxx(14|17|20|23|26)' build-reduced/targets.txt; then
            grep -E 'cxx(14|17|20|23|26)' build-reduced/targets.txt
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit ctest.xml

      - name: Install package
        run: cmake --install build --prefix build/install

      - name: Verify verification dependencies are not installed
        run: >-
          test -z "$(find build/install
          \( -iname '*catch2*' -o -iname '*benchmark*' \) -print -quit)"

      - name: Verify installed package consumer
        run: |
          cmake -S test/contracts/consumer -B build/consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build --parallel
          ./build/consumer-build/csv2_consumer
          ./build/consumer-build/csv2_no_mmap_consumer

      - name: Verify relocatable pkg-config consumer
        run: |
          csv2_pc_dir="$(dirname "$(find build/install -name csv2.pc -print -quit)")"
          csv2_includedir="$(PKG_CONFIG_PATH="$csv2_pc_dir" pkg-config \
            --variable=includedir csv2)"
          test -f "$csv2_includedir/csv2/reader.hpp"
          g++-14 -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            $(PKG_CONFIG_PATH="$csv2_pc_dir" pkg-config --cflags csv2) \
            test/contracts/consumer/pkg_config.cpp -o build/pkg-config-consumer
          ./build/pkg-config-consumer

      - name: Verify single-header regeneration
        run: |
          python3 utils/amalgamate/amalgamate.py -c single_include.json -s .
          git diff --exit-code -- single_include/csv2/csv2.hpp

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-gcc14-ctest
          path: build/ctest.xml
          if-no-files-found: error

  gcc-sanitizers:
    name: Linux / GCC 14 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=OFF
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_ENABLE_SANITIZERS=ON
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Build
        run: cmake --build build --parallel

      - name: Test with ASan, UBSan, and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-runtime
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

  clang:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: Clang 18 + libc++
            artifact: clang18-libcxx
            build_type: Release
            benchmarks: "ON"
            sanitizers: "OFF"
          - compiler: Clang 18 + libc++ / ASan + UBSan
            artifact: clang18-libcxx-sanitizers
            build_type: Debug
            benchmarks: "OFF"
            sanitizers: "ON"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Clang 18 libc++ and clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libc++-18-dev libc++abi-18-dev clang-format-18

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=${{ matrix.benchmarks }}
          -DCSV2_BUILD_BENCHMARK_CHECKS=${{ matrix.benchmarks }}
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        if: matrix.sanitizers == 'OFF'
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit ctest.xml

      - name: Test with ASan and UBSan
        if: matrix.sanitizers == 'ON'
        env:
          # Ubuntu's prebuilt libc++/libc++abi hits LLVM #59432: its packaging
          # prevents ASan from interposing exception deallocation. The GCC
          # sanitizer job above retains alloc/dealloc mismatch coverage.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:alloc_dealloc_mismatch=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-runtime
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

      - name: Check first-party C++ formatting
        if: matrix.sanitizers == 'OFF'
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' \
            ':!third_party/**' ':!single_include/**' ':!include/csv2/mio.hpp' | \
            xargs -0 clang-format-18 --dry-run --Werror

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.artifact }}-ctest
          path: build/ctest.xml
          if-no-files-found: error
