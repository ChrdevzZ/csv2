name: Linux

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: Linux / GCC 14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CSV2_QUICK_ASSERTION_BACKEND: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files <= 3000 && 'minitest' || 'auto' }}
      CSV2_QUICK_BUILD_BENCHMARKS: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files <= 3000 && 'OFF' || 'ON' }}
      CSV2_QUICK_BUILD_BENCHMARK_CHECKS: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files <= 3000 && 'OFF' || 'ON' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_TEST_ASSERTION_BACKEND="$CSV2_QUICK_ASSERTION_BACKEND"
          -DCSV2_BUILD_BENCHMARKS="$CSV2_QUICK_BUILD_BENCHMARKS"
          -DCSV2_BUILD_BENCHMARK_CHECKS="$CSV2_QUICK_BUILD_BENCHMARK_CHECKS"
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Verify reduced compiler feature matrix
        run: |
          cmake -S . -B build-reduced -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_COMPILE_FEATURES=cxx_std_11 \
            -DCSV2_BUILD_TESTS=ON \
            -DCSV2_BUILD_BENCHMARKS=OFF \
            -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          cmake --build build-reduced --target \
            csv2_test csv2_single_header_test \
            csv2_standard_contract_module_cxx11 \
            csv2_standard_contract_single_cxx11 --parallel

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >-
          ctest --test-dir build --parallel 2
          --output-on-failure --output-junit ctest.xml

      - name: Verify Release LTO observer and checksum semantics
        if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 3000
        run: |
          cmake --build build --target csv2_benchmark_observer_audit --parallel
          ctest --test-dir build \
            -R '^csv2\.benchmark\.current\.observer_audit\.' \
            --no-tests=error --output-on-failure \
            --output-junit observer-lto.xml

      - name: Install package
        run: cmake --install build --prefix build/install

      - name: Verify installed package consumer
        run: |
          cmake -S test/contracts/consumer -B build/consumer-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build --parallel
          ./build/consumer-build/csv2_consumer
          ./build/consumer-build/csv2_no_mmap_consumer

      - name: Verify relocatable pkg-config consumer
        run: |
          csv2_pc_dir="$PWD/build/install/lib/pkgconfig"
          g++-14 -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            $(PKG_CONFIG_LIBDIR="$csv2_pc_dir" pkg-config --cflags csv2) \
            test/contracts/consumer/pkg_config.cpp -o build/pkg-config-consumer
          ./build/pkg-config-consumer

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-gcc14-ctest
          path: |
            build/ctest.xml
            build/observer-lto.xml
          if-no-files-found: error

  gcc-sanitizers:
    name: Linux / GCC 14 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_TEST_ASSERTION_BACKEND=minitest
          -DCSV2_BUILD_BENCHMARKS=OFF
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_ENABLE_SANITIZERS=ON
          -DCSV2_CI_EXPECTED_COMPILER_ID=GNU
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=14

      - name: Build sanitizer smoke
        run: cmake --build build --parallel --target csv2_sanitizer_smoke

      - name: Test with ASan, UBSan, and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-smoke
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

  clang:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: Clang 18 + libc++
            artifact: clang18-libcxx
            build_type: Release
            benchmarks: "ON"
            sanitizers: "OFF"
            assertion_backend: auto
          - compiler: Clang 18 + libc++ / ASan + UBSan
            artifact: clang18-libcxx-sanitizers
            build_type: Debug
            benchmarks: "OFF"
            sanitizers: "ON"
            assertion_backend: minitest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Clang 18 libc++ and clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libc++-18-dev libc++abi-18-dev clang-format-18

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_TEST_ASSERTION_BACKEND=${{ matrix.assertion_backend }}
          -DCSV2_BUILD_BENCHMARKS=${{ matrix.benchmarks }}
          -DCSV2_BUILD_BENCHMARK_CHECKS=${{ matrix.benchmarks }}
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_CI_EXPECTED_COMPILER_ID=Clang
          -DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=18

      - name: Build
        if: matrix.sanitizers == 'OFF'
        run: cmake --build build --parallel

      - name: Build sanitizer smoke
        if: matrix.sanitizers == 'ON'
        run: cmake --build build --parallel --target csv2_sanitizer_smoke

      - name: Test
        if: matrix.sanitizers == 'OFF'
        run: >-
          ctest --test-dir build --parallel 2 --output-on-failure
          --output-junit ctest.xml

      - name: Test with ASan and UBSan
        if: matrix.sanitizers == 'ON'
        env:
          # Ubuntu's prebuilt libc++/libc++abi hits LLVM #59432: its packaging
          # prevents ASan from interposing exception deallocation. The GCC
          # sanitizer job above retains alloc/dealloc mismatch coverage.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:alloc_dealloc_mismatch=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build
          -L sanitizer-smoke
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

      - name: Check first-party C++ formatting
        if: matrix.sanitizers == 'OFF'
        run: |
          git ls-files -z -- '*.cpp' '*.hpp' \
            ':!third_party/**' ':!single_include/**' ':!include/csv2/mio.hpp' | \
            xargs -0 clang-format-18 --dry-run --Werror

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.artifact }}-ctest
          path: build/ctest.xml
          if-no-files-found: error
