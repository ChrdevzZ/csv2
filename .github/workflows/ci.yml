name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 13 + ASan/UBSan
            os: ubuntu-24.04
            configure: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_COMPILER=g++-13
            sanitizers: ON
            install_libcxx: false
          - name: Linux Clang 18 + libc++ + ASan/UBSan
            os: ubuntu-24.04
            configure: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_COMPILER=clang++-18
              -DCMAKE_CXX_FLAGS=-stdlib=libc++
            sanitizers: ON
            install_libcxx: true
          - name: macOS AppleClang
            os: macos-26
            configure: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_COMPILER=clang++
            sanitizers: OFF
            install_libcxx: false
          - name: Windows MSVC
            os: windows-2025-vs2026
            configure: '-G "Visual Studio 18 2026" -A x64'
            sanitizers: OFF
            install_libcxx: false
          - name: Windows Clang-CL
            os: windows-2025-vs2026
            configure: '-G "Visual Studio 18 2026" -A x64 -T ClangCL'
            sanitizers: OFF
            install_libcxx: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libc++
        if: matrix.install_libcxx
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libc++-18-dev libc++abi-18-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=ON
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Verify single-header regeneration
        run: |
          python utils/amalgamate/amalgamate.py -c single_include.json -s .
          git diff --exit-code -- single_include/csv2/csv2.hpp
