name: Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / ${{ matrix.compiler }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MSVC 19.51
            configuration: Debug
            toolset: ""
            benchmarks: "ON"
            sanitizers: "OFF"
            sanitizer_runtime: none
            expected_id: MSVC
            expected_version: "19.51"
            require_cxx26: "OFF"
            install: true
          - compiler: MSVC 19.51 / ASan
            configuration: Release
            toolset: ""
            benchmarks: "OFF"
            sanitizers: "ON"
            sanitizer_runtime: msvc
            expected_id: MSVC
            expected_version: "19.51"
            require_cxx26: "OFF"
            install: false
          - compiler: Clang-CL 22.1
            configuration: Release
            toolset: -T ClangCL
            benchmarks: "OFF"
            sanitizers: "OFF"
            sanitizer_runtime: none
            expected_id: Clang
            expected_version: "22.1"
            require_cxx26: "ON"
            install: false
          - compiler: Clang-CL 22.1 / ASan + UBSan
            configuration: Release
            toolset: -T ClangCL
            benchmarks: "OFF"
            sanitizers: "ON"
            sanitizer_runtime: clang
            expected_id: Clang
            expected_version: "22.1"
            require_cxx26: "ON"
            install: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          ${{ matrix.toolset }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=${{ matrix.benchmarks }}
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=${{ matrix.require_cxx26 }}
          -DCSV2_CI_EXPECTED_COMPILER_ID=${{ matrix.expected_id }}
          "-DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=${{ matrix.expected_version }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        if: matrix.sanitizers == 'OFF'
        run: >-
          ctest --test-dir build
          -C ${{ matrix.configuration }}
          --output-on-failure

      - name: Test with sanitizers
        if: matrix.sanitizers == 'ON'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio installation was not found"
          }

          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $testManifest = ctest --test-dir build `
            -C ${{ matrix.configuration }} `
            -L sanitizer-runtime `
            --show-only=json-v1 | ConvertFrom-Json
          $tests = @($testManifest.tests)
          if ($tests.Count -eq 0) {
            throw "CTest registered no sanitizer runtime tests"
          }
          $unexpectedTests = @($tests | Where-Object {
            $_.name -like "csv2.benchmark.*"
          })
          if ($unexpectedTests.Count -ne 0) {
            throw "Benchmark tests must not run under sanitizers: " +
              (($unexpectedTests | ForEach-Object name) -join ", ")
          }
          $duplicateNames = @($tests | Group-Object name | Where-Object Count -ne 1)
          if ($duplicateNames.Count -ne 0) {
            throw "CTest sanitizer manifest contains duplicate names"
          }

          $commands = @(
            "call `"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul"
          )

          if ("${{ matrix.sanitizer_runtime }}" -eq "clang") {
            $clangCl = Join-Path $installationPath `
              "VC\Tools\Llvm\x64\bin\clang-cl.exe"
            if (-not (Test-Path -LiteralPath $clangCl)) {
              throw "Clang-CL was not found: $clangCl"
            }

            $resourceDirectory = & $clangCl --print-resource-dir
            if ($LASTEXITCODE -ne 0 -or -not $resourceDirectory) {
              throw "Clang-CL resource directory could not be determined"
            }
            $runtimeDirectory = Join-Path $resourceDirectory "lib\windows"
            $asanDll = Join-Path $runtimeDirectory `
              "clang_rt.asan_dynamic-x86_64.dll"
            if (-not (Test-Path -LiteralPath $asanDll)) {
              throw "Clang-CL AddressSanitizer runtime was not found: $asanDll"
            }

            $commands += "set `"PATH=$runtimeDirectory;%PATH%`""
            $commands += `
              "set UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          }

          foreach ($test in $tests) {
            $command = @($test.command)
            if ($command.Count -eq 0 -or `
                -not (Test-Path -LiteralPath $command[0])) {
              throw "Sanitizer test has no executable: $($test.name)"
            }

            $workingDirectory = ($test.properties |
              Where-Object name -eq "WORKING_DIRECTORY").value
            if (-not $workingDirectory -or `
                -not (Test-Path -LiteralPath $workingDirectory)) {
              throw "Sanitizer test has no working directory: $($test.name)"
            }

            $quotedCommand = ($command | ForEach-Object {
              if ($_ -match '"') {
                throw "Sanitizer test argument contains an unsupported quote: $_"
              }
              "`"$_`""
            }) -join " "
            $commands += "echo [sanitizer] $($test.name)"
            $commands += "cd /d `"$workingDirectory`""
            $commands += `
              "$quotedCommand --no-version --no-intro --no-colors"
          }

          cmd.exe /d /s /c ($commands -join " && ")
          if ($LASTEXITCODE -ne 0) {
            throw "Sanitizer test execution failed with exit code $LASTEXITCODE"
          }

      - name: Install package
        if: matrix.install
        run: >-
          cmake --install build
          --config ${{ matrix.configuration }}
          --prefix build/install

      - name: Verify installed package consumer
        if: matrix.install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/consumer | Out-Null
          @'
          cmake_minimum_required(VERSION 3.10)
          project(csv2_consumer LANGUAGES CXX)
          find_package(csv2 CONFIG REQUIRED)
          add_executable(csv2_consumer main.cpp)
          target_link_libraries(csv2_consumer PRIVATE csv2::csv2)
          target_compile_features(csv2_consumer PRIVATE cxx_std_20)
          set_target_properties(csv2_consumer PROPERTIES CXX_EXTENSIONS OFF)
          add_executable(csv2_no_mmap_consumer no_mmap.cpp)
          target_link_libraries(csv2_no_mmap_consumer PRIVATE csv2::csv2)
          target_compile_features(csv2_no_mmap_consumer PRIVATE cxx_std_11)
          target_compile_definitions(csv2_no_mmap_consumer PRIVATE CSV2_HAS_MMAP=0)
          set_target_properties(csv2_no_mmap_consumer PROPERTIES CXX_EXTENSIONS OFF)
          '@ | Set-Content build/consumer/CMakeLists.txt
          @'
          #include <csv2/reader.hpp>
          #include <string>
          int main() {
            csv2::Reader<> reader;
            return reader.parse(std::string("a,b")) ? 0 : 1;
          }
          '@ | Set-Content build/consumer/main.cpp
          @'
          #include <csv2/mio.hpp>
          #ifdef MIO_MMAP_HEADER
          #error "mio must be absent when CSV2_HAS_MMAP=0"
          #endif
          #include <csv2/errors.hpp>
          #include <csv2/parameters.hpp>
          #include <csv2/reader.hpp>
          #include <csv2/writer.hpp>
          int main() { return CSV2_HAS_MMAP; }
          '@ | Set-Content build/consumer/no_mmap.cpp
          cmake -S build/consumer -B build/consumer-build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build `
            --config ${{ matrix.configuration }} --parallel
          & build/consumer-build/${{ matrix.configuration }}/csv2_consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed package consumer failed"
          }
          & build/consumer-build/${{ matrix.configuration }}/csv2_no_mmap_consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed no-mmap consumer failed"
          }

      - name: Verify single-header regeneration
        if: matrix.install
        run: |
          python utils/amalgamate/amalgamate.py -c single_include.json -s .
          git diff --exit-code -- single_include/csv2/csv2.hpp
