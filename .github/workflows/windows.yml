name: Windows

on:
  workflow_call:
    inputs:
      quick:
        type: boolean
        default: true
      benchmark:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      quick:
        description: Run core, package, and sanitizer contracts
        type: boolean
        default: true
      benchmark:
        description: Run MSVC benchmark portability contracts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: inputs.quick || inputs.benchmark
    name: Windows / ${{ matrix.compiler }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.quick && '[{"compiler":"MSVC 19.51","artifact":"msvc1951","configuration":"Debug","toolset":"","benchmark_owner":true,"sanitizers":"OFF","assertion_backend":"auto","sanitizer_runtime":"none","expected_id":"MSVC","expected_version":"19.51","install":true},{"compiler":"MSVC 19.51 / ASan","artifact":"msvc1951-asan","configuration":"Release","toolset":"","benchmark_owner":false,"sanitizers":"ON","assertion_backend":"minitest","sanitizer_runtime":"msvc","expected_id":"MSVC","expected_version":"19.51","install":false},{"compiler":"Clang-CL 22.1","artifact":"clangcl221","configuration":"Release","toolset":"-T ClangCL","benchmark_owner":false,"sanitizers":"OFF","assertion_backend":"minitest","sanitizer_runtime":"none","expected_id":"Clang","expected_version":"22.1","install":false},{"compiler":"Clang-CL 22.1 / ASan + UBSan","artifact":"clangcl221-sanitizers","configuration":"Release","toolset":"-T ClangCL","benchmark_owner":false,"sanitizers":"ON","assertion_backend":"minitest","sanitizer_runtime":"clang","expected_id":"Clang","expected_version":"22.1","install":false}]' || '[{"compiler":"MSVC 19.51","artifact":"msvc1951","configuration":"Debug","toolset":"","benchmark_owner":true,"sanitizers":"OFF","assertion_backend":"auto","sanitizer_runtime":"none","expected_id":"MSVC","expected_version":"19.51","install":false}]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          ${{ matrix.toolset }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=${{ inputs.quick && 'ON' || 'OFF' }}
          -DCSV2_TEST_ASSERTION_BACKEND=${{ matrix.assertion_backend }}
          -DCSV2_BUILD_BENCHMARKS=${{ inputs.benchmark && matrix.benchmark_owner && 'ON' || 'OFF' }}
          -DCSV2_BUILD_BENCHMARK_CHECKS=${{ inputs.benchmark && matrix.benchmark_owner && 'ON' || 'OFF' }}
          -DCSV2_BENCHMARKS_EXCLUDE_FROM_ALL=ON
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_REQUIRE_PYTHON_AUDITS=ON
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_CI_EXPECTED_COMPILER_ID=${{ matrix.expected_id }}
          "-DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=${{ matrix.expected_version }}"

      - name: Build
        if: matrix.sanitizers == 'OFF' && inputs.quick
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Build benchmark portability owners
        if: matrix.sanitizers == 'OFF' && matrix.benchmark_owner && inputs.benchmark
        run: >-
          cmake --build build --config ${{ matrix.configuration }} --parallel
          --target csv2_benchmark_portability

      - name: Build sanitizer smoke
        if: matrix.sanitizers == 'ON'
        run: >-
          cmake --build build --config ${{ matrix.configuration }} --parallel
          --target csv2_sanitizer_smoke

      - name: Test
        if: matrix.sanitizers == 'OFF' && inputs.quick
        run: >-
          ctest --test-dir build
          -C ${{ matrix.configuration }}
          -LE benchmark-checksum
          --parallel 2
          --no-tests=error
          --output-junit ctest.xml
          --output-on-failure

      - name: Test benchmark portability owners
        if: matrix.sanitizers == 'OFF' && matrix.benchmark_owner && inputs.benchmark
        run: >-
          ctest --test-dir build
          -C ${{ matrix.configuration }}
          -L benchmark-portability
          --parallel 2
          --no-tests=error
          --output-junit benchmark-portability.xml
          --output-on-failure

      - name: Test with sanitizers
        if: matrix.sanitizers == 'ON'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio installation was not found"
          }

          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $buildDirectory = (Resolve-Path build).Path
          $junit = Join-Path $buildDirectory "ctest.xml"
          $runner = (Resolve-Path `
            test/platform/run_windows_sanitizer_tests.ps1).Path

          $commands = @(
            "call `"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul"
          )

          if ("${{ matrix.sanitizer_runtime }}" -eq "clang") {
            $clangCl = Join-Path $installationPath `
              "VC\Tools\Llvm\x64\bin\clang-cl.exe"
            if (-not (Test-Path -LiteralPath $clangCl)) {
              throw "Clang-CL was not found: $clangCl"
            }

            $resourceDirectory = & $clangCl --print-resource-dir
            if ($LASTEXITCODE -ne 0 -or -not $resourceDirectory) {
              throw "Clang-CL resource directory could not be determined"
            }
            $runtimeDirectory = Join-Path $resourceDirectory "lib\windows"
            $asanDll = Join-Path $runtimeDirectory `
              "clang_rt.asan_dynamic-x86_64.dll"
            if (-not (Test-Path -LiteralPath $asanDll)) {
              throw "Clang-CL AddressSanitizer runtime was not found: $asanDll"
            }

            $commands += "set `"PATH=$runtimeDirectory;%PATH%`""
            $commands += `
              "set UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          }

          $commands += `
            "pwsh.exe -NoLogo -NoProfile -File `"$runner`" " +
            "-BuildDirectory `"$buildDirectory`" " +
            "-Configuration ${{ matrix.configuration }} " +
            "-OutputJunit `"$junit`" " +
            "-Label `"sanitizer-smoke`""

          cmd.exe /d /s /c ($commands -join " && ")
          if ($LASTEXITCODE -ne 0) {
            throw "Sanitizer test execution failed with exit code $LASTEXITCODE"
          }

      - name: Install package
        if: matrix.install && inputs.quick
        run: >-
          cmake --install build
          --config ${{ matrix.configuration }}
          --prefix build/install

      - name: Verify installed package consumer
        if: matrix.install && inputs.quick
        shell: pwsh
        run: |
          cmake -S test/contracts/consumer -B build/consumer-build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build `
            --config ${{ matrix.configuration }} --parallel
          & build/consumer-build/${{ matrix.configuration }}/csv2_consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed package consumer failed"
          }
          & build/consumer-build/${{ matrix.configuration }}/csv2_no_mmap_consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed no-mmap consumer failed"
          }

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.artifact }}-ctest
          path: |
            build/ctest.xml
            build/benchmark-portability.xml
          if-no-files-found: error
