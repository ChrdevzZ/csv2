name: Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / ${{ matrix.compiler }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MSVC 19.51
            artifact: msvc1951
            configuration: Debug
            toolset: ""
            benchmarks: "ON"
            sanitizers: "OFF"
            sanitizer_runtime: none
            expected_id: MSVC
            expected_version: "19.51"
            require_cxx26: "OFF"
            install: true
          - compiler: MSVC 19.51 / ASan
            artifact: msvc1951-asan
            configuration: Release
            toolset: ""
            benchmarks: "OFF"
            sanitizers: "ON"
            sanitizer_runtime: msvc
            expected_id: MSVC
            expected_version: "19.51"
            require_cxx26: "OFF"
            install: false
          - compiler: Clang-CL 22.1
            artifact: clangcl221
            configuration: Release
            toolset: -T ClangCL
            benchmarks: "OFF"
            sanitizers: "OFF"
            sanitizer_runtime: none
            expected_id: Clang
            expected_version: "22.1"
            require_cxx26: "ON"
            install: false
          - compiler: Clang-CL 22.1 / ASan + UBSan
            artifact: clangcl221-sanitizers
            configuration: Release
            toolset: -T ClangCL
            benchmarks: "OFF"
            sanitizers: "ON"
            sanitizer_runtime: clang
            expected_id: Clang
            expected_version: "22.1"
            require_cxx26: "ON"
            install: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          ${{ matrix.toolset }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCSV2_BUILD_TESTS=ON
          -DCSV2_BUILD_BENCHMARKS=${{ matrix.benchmarks }}
          -DCSV2_BUILD_BENCHMARK_CHECKS=${{ matrix.benchmarks }}
          -DCSV2_VERIFICATION_PROFILE=quick
          -DCSV2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCSV2_REQUIRE_MODERN_STANDARD_TESTS=ON
          -DCSV2_REQUIRE_CXX26_TESTS=${{ matrix.require_cxx26 }}
          -DCSV2_CI_EXPECTED_COMPILER_ID=${{ matrix.expected_id }}
          "-DCSV2_CI_EXPECTED_COMPILER_VERSION_PREFIX=${{ matrix.expected_version }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        if: matrix.sanitizers == 'OFF'
        run: >-
          ctest --test-dir build
          -C ${{ matrix.configuration }}
          --output-junit ctest.xml
          --output-on-failure

      - name: Test with sanitizers
        if: matrix.sanitizers == 'ON'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio installation was not found"
          }

          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $buildDirectory = (Resolve-Path build).Path
          $junit = Join-Path $buildDirectory "ctest.xml"
          $runner = (Resolve-Path `
            test/platform/run_windows_sanitizer_tests.ps1).Path

          $commands = @(
            "call `"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul"
          )

          if ("${{ matrix.sanitizer_runtime }}" -eq "clang") {
            $clangCl = Join-Path $installationPath `
              "VC\Tools\Llvm\x64\bin\clang-cl.exe"
            if (-not (Test-Path -LiteralPath $clangCl)) {
              throw "Clang-CL was not found: $clangCl"
            }

            $resourceDirectory = & $clangCl --print-resource-dir
            if ($LASTEXITCODE -ne 0 -or -not $resourceDirectory) {
              throw "Clang-CL resource directory could not be determined"
            }
            $runtimeDirectory = Join-Path $resourceDirectory "lib\windows"
            $asanDll = Join-Path $runtimeDirectory `
              "clang_rt.asan_dynamic-x86_64.dll"
            if (-not (Test-Path -LiteralPath $asanDll)) {
              throw "Clang-CL AddressSanitizer runtime was not found: $asanDll"
            }

            $commands += "set `"PATH=$runtimeDirectory;%PATH%`""
            $commands += `
              "set UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          }

          $commands += `
            "pwsh.exe -NoLogo -NoProfile -File `"$runner`" " +
            "-BuildDirectory `"$buildDirectory`" " +
            "-Configuration ${{ matrix.configuration }} " +
            "-OutputJunit `"$junit`""

          cmd.exe /d /s /c ($commands -join " && ")
          if ($LASTEXITCODE -ne 0) {
            throw "Sanitizer test execution failed with exit code $LASTEXITCODE"
          }

      - name: Install package
        if: matrix.install
        run: >-
          cmake --install build
          --config ${{ matrix.configuration }}
          --prefix build/install

      - name: Verify verification dependencies are not installed
        if: matrix.install
        shell: pwsh
        run: |
          $unexpected = Get-ChildItem build/install -Recurse -File | Where-Object {
            $_.Name -match 'catch2|benchmark'
          }
          if ($unexpected) {
            throw "Verification dependencies leaked into install: $($unexpected.FullName)"
          }

      - name: Verify installed package consumer
        if: matrix.install
        shell: pwsh
        run: |
          cmake -S test/contracts/consumer -B build/consumer-build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-build `
            --config ${{ matrix.configuration }} --parallel
          & build/consumer-build/${{ matrix.configuration }}/csv2_consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed package consumer failed"
          }
          & build/consumer-build/${{ matrix.configuration }}/csv2_no_mmap_consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed no-mmap consumer failed"
          }

      - name: Verify single-header regeneration
        if: matrix.install
        run: |
          python utils/amalgamate/amalgamate.py -c single_include.json -s .
          git diff --exit-code -- single_include/csv2/csv2.hpp

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.artifact }}-ctest
          path: build/ctest.xml
          if-no-files-found: error
